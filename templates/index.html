<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Downloader</title>
    <style>
        :root {
            --primary: #ff0000;
            --primary-hover: #cc0000;
            --bg: #1a1a1a;
            --surface: #2d2d2d;
            --text: #ffffff;
            --text-secondary: #aaaaaa;
            --border: #404040;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .container {
            background-color: var(--surface);
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 500px;
            text-align: center;
        }

        h1 {
            margin-top: 0;
            margin-bottom: 10px;
            font-size: 28px;
        }

        p {
            color: var(--text-secondary);
            margin-bottom: 30px;
        }

        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
        }

        input[type="url"], select {
            width: 100%;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid var(--border);
            background-color: var(--bg);
            color: var(--text);
            font-size: 16px;
            box-sizing: border-box;
        }
        
        input[type="url"]:focus, select:focus {
            outline: none;
            border-color: var(--primary);
        }

        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 14px 20px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        button:disabled {
            background-color: #555555;
            cursor: not-allowed;
        }

        .loader {
            display: none;
            margin-top: 20px;
            flex-direction: column;
            align-items: center;
        }

        .spinner {
            border: 4px solid var(--border);
            border-top: 4px solid var(--primary);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin-bottom: 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        #message {
            margin-top: 20px;
            padding: 10px;
            border-radius: 6px;
            display: none;
        }

        .error {
            background-color: rgba(255, 0, 0, 0.1);
            color: #ff6b6b;
            border: 1px solid #ff6b6b;
        }
        
        .success {
            background-color: rgba(0, 255, 0, 0.1);
            color: #51cf66;
            border: 1px solid #51cf66;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>YT Downloader</h1>
        <p>Descarga videos y audios de YouTube fácilmente</p>

        <form id="downloadForm">
            <div class="input-group">
                <label for="url">Enlace de YouTube</label>
                <input type="url" id="url" placeholder="https://www.youtube.com/watch?v=..." required>
            </div>

            <div class="input-group">
                <label for="format">Formato y Calidad</label>
                <select id="format">
                    <option value="480">Video MP4 - 480p</option>
                    <option value="720">Video MP4 - 720p</option>
                    <option value="1080" selected>Video MP4 - 1080p</option>
                    <option value="1440">Video MP4 - 1440p</option>
                    <option value="mp3">Audio MP3</option>
                </select>
            </div>

            <button type="submit" id="downloadBtn">Descargar</button>
        </form>

        <div class="loader" id="loader">
            <div class="spinner"></div>
            <div id="loaderText">Procesando y descargando... Esto puede tardar unos minutos.</div>
        </div>

        <div id="message"></div>
    </div>

    <script>
        const form = document.getElementById('downloadForm');
        const downloadBtn = document.getElementById('downloadBtn');
        const loader = document.getElementById('loader');
        const messageEl = document.getElementById('message');
        const urlInput = document.getElementById('url');
        const formatSelect = document.getElementById('format');

        function showMessage(msg, type) {
            messageEl.textContent = msg;
            messageEl.className = type;
            messageEl.style.display = 'block';
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const url = urlInput.value.trim();
            const format = formatSelect.value;
            
            if (!url) return;

            // Update UI
            downloadBtn.disabled = true;
            loader.style.display = 'flex';
            messageEl.style.display = 'none';
            
            try {
                // Perform the download request
                const response = await fetch('/api/download', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ url, format })
                });

                if (!response.ok) {
                    const data = await response.json();
                    throw new Error(data.error || 'Error al descargar el archivo');
                }

                // Get filename from Content-Disposition header if available
                let filename = "download";
                if (format === 'mp3') filename += '.mp3';
                else filename += '.mp4';
                
                const disposition = response.headers.get('Content-Disposition');
                if (disposition && disposition.indexOf('attachment') !== -1) {
                    const filenameRegex = /filename[^;=\n]*=((['"]).*?\2|[^;\n]*)/;
                    const matches = filenameRegex.exec(disposition);
                    if (matches != null && matches[1]) {
                        filename = matches[1].replace(/['"]/g, '');
                    }
                }

                // Create blob and download it
                const blob = await response.blob();
                const downloadUrl = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = downloadUrl;
                a.download = filename;
                document.body.appendChild(a);
                a.click();
                window.URL.revokeObjectURL(downloadUrl);
                document.body.removeChild(a);

                showMessage('¡Descarga completada!', 'success');
                urlInput.value = '';
            } catch (error) {
                showMessage(error.message, 'error');
            } finally {
                downloadBtn.disabled = false;
                loader.style.display = 'none';
            }
        });
    </script>
</body>
</html>
